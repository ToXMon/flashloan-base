name: Build and Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Rust sidecar
        uses: docker/build-push-action@v5
        with:
          context: .
          file: rust-sidecar/Dockerfile
          push: true
          tags: ghcr.io/toxmon/flashloan-base-rust-sidecar:v1.0.0

      - name: Build and push TypeScript core
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ts
          push: true
          tags: ghcr.io/toxmon/flashloan-base-typescript-core:v1.0.0
