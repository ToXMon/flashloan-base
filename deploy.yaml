---
version: "2.0"

services:
  rust-sidecar:
    image: ghcr.io/toxmoN/flashloan-base-rust-sidecar:v1.0.0
    env:
      - "RUST_LOG=info"
      - "GRPC_BIND=0.0.0.0:50051"
      - "BASE_RPC_URL=https://base-mainnet.g.alchemy.com/v2/cEk61ALx-EF3B2OyNcajj"
      - "SIDECAR_WS_URL=wss://base-mainnet.g.alchemy.com/v2/cEk61ALx-EF3B2OyNcajj"
      - "SIDECAR_RPC_URL=https://base-mainnet.g.alchemy.com/v2/cEk61ALx-EF3B2OyNcajj"
    expose:
      - port: 50051
        as: 50051
        proto: tcp
        to:
          - service: typescript-core

  typescript-core:
    image: ghcr.io/toxmoN/flashloan-base-typescript-core:v1.0.0
    env:
      - "GRPC_SIDECAR_ADDR=rust-sidecar:50051"
      - "BASE_RPC_URL=https://base-mainnet.g.alchemy.com/v2/cEk61ALx-EF3B2OyNcajj"
      - "SIDECAR_WS_URL=wss://base-mainnet.g.alchemy.com/v2/cEk61ALx-EF3B2OyNcajj"
      - "SIDECAR_RPC_URL=https://base-mainnet.g.alchemy.com/v2/cEk61ALx-EF3B2OyNcajj"
      - "HEALTH_FACTOR_THRESHOLD=1.1"
      - "MAX_SLIPPAGE_BPS=50"
      - "GAS_PRICE_MULTIPLIER=1.1"
      - "PRIORITY_FEE=0.001"
      - "SCAN_INTERVAL_MS=15000"
      - "MIN_PROFIT_USD=0.10"
      - "POSITION_V2_ADDRESS=0x7f38A6fB772A5C3E0e3c762E06093C0bB2a7211A"
      - "POSITION_CONTRACT=0x7f38A6fB772A5C3E0e3c762E06093C0bB2a7211A"
      - "TOKEN_WETH=0x4200000000000000000000000000000000000006"
      - "TOKEN_USDC=0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
      - "TOKEN_DAI=0x50c5725949A6F0c72E6C4a641F24049A917DB0Cb"
      - "TOKEN_cbETH=0x2Ae3F1Ec7F1F5012CFEab0185bfc7aa3cf0DEc22"
      - "TOKEN_USDbC=0xd9aAEc86B65D86f6A7B5B1b0c42FFA531710b6CA"
      - "DEFAULT_POOL_FEE=500"

profiles:
  compute:
    rust-sidecar:
      resources:
        cpu:
          units: 1.0
        memory:
          size: 512Mi
        storage:
          size: 2Gi
    typescript-core:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          size: 1Gi
  placement:
    dcloud:
      pricing:
        rust-sidecar:
          denom: uact
          amount: 1000
        typescript-core:
          denom: uact
          amount: 1000

deployment:
  rust-sidecar:
    dcloud:
      profile: rust-sidecar
      count: 1
  typescript-core:
    dcloud:
      profile: typescript-core
      count: 1
