name: Build and Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag override'
        required: false
        default: 'v1.0.0'

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.event.inputs.tag || 'v1.0.0' }}
  RUST_IMAGE: ghcr.io/toxmon/flashloan-base-rust-sidecar
  TS_IMAGE: ghcr.io/toxmon/flashloan-base-typescript-core

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Rust sidecar
        uses: docker/build-push-action@v5
        with:
          context: .
          file: rust-sidecar/Dockerfile
          push: true
          tags: |
            ${{ env.RUST_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.RUST_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push TypeScript core
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ts
          push: true
          tags: |
            ${{ env.TS_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.TS_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
