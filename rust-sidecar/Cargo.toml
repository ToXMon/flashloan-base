[package]
name = "flashloan-sidecar"
version = "0.1.0"
edition = "2021"
description = "High-speed opportunity detection sidecar for Base chain flash loan system"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Ethereum RPC (replaces ethers-rs)
alloy = { version = "1", features = [
    "full",
    "provider-ws",
    "rpc-types",
    "contract",
    "network",
    "signers",
    "signer-local",
    "transports",
    "transport-ws",
    "transport-http",
] }

# High-performance JSON parsing (2-4 GB/s)
simd-json = "0.14"

# WebSocket
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"

# Hex encoding/decoding
hex = "0.4"

# gRPC
tonic = "0.13"
prost = "0.13"
tokio-stream = "0.1"

# Concurrent HashMap
dashmap = "6"

# Graph structures for triangle arbitrage path finding
petgraph = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

[build-dependencies]
tonic-build = "0.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
